name: Build and Release

# Triggers:
#  - push to main: every merge tags + ships a release
#    (`v$(date)-$(short_hash)`).
#  - workflow_dispatch: manual run from the Actions tab — handy when
#    you want a release without a code change (e.g. picking up a
#    vendor pin bump that's already in main).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for `git push` of the auto-generated tag and for the
# release-action to upload artifacts.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Rustup ships with the runner; we just need the musl target +
      # musl-tools (provides the musl-gcc linker our RUSTFLAGS asks
      # for) and the clippy component for the quality gate. The toolchain
      # version is pinned by rust-toolchain.toml, which rustup honours here
      # (auto-installing that exact stable), so CI, dev, and the Docker
      # builder all compile with the same rustc.
      - name: Install Rust musl target + clippy + musl-tools + minisign
        run: |
          rustup target add x86_64-unknown-linux-musl
          rustup component add clippy
          sudo apt-get update -qq
          # minisign verifies dnscrypt-proxy's upstream .minisig signature in
          # vendor/update.sh. Without it a COLD vendor materialisation aborts
          # ("minisign not installed"), which only ever surfaced when the blob
          # cache missed — so this job could not build from scratch. Do not
          # substitute ALLOW_UNVERIFIED_VENDOR=1: that downgrades a signature
          # check to bare HTTPS on a binary we ship inside the release artifact.
          sudo apt-get install -y -qq musl-tools minisign

      # Dependency policy gate — first thing after the toolchain, before the
      # multi-minute vendor materialisation and build, so a supply-chain
      # problem fails the run in ~a minute. Enforces deny.toml: RUSTSEC
      # advisories, yanked crates, the license allowlist, the duplicate-version
      # allowlist, and crates.io-only sources.
      #
      # Deliberately NOT EmbarkStudios/cargo-deny-action: that action runs in
      # an Alpine container whose rustup cannot install the musl-host build of
      # the toolchain rust-toolchain.toml pins, so every run since 2026-07-18
      # died on `override toolchain '<ver>-x86_64-unknown-linux-musl' is not
      # installed` — before clippy or the tests, which is why lint drift
      # reached main unnoticed. Running the release binary directly on the
      # runner sidesteps the container entirely, and pinning the version +
      # SHA-256 matches how every other third-party binary here is vendored.
      - name: Dependency policy (cargo-deny)
        env:
          DENY_VERSION: "0.20.2"
          DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
        run: |
          set -euo pipefail
          # Staged in RUNNER_TEMP so nothing lands in the checkout — the
          # release job later archives from a clean working tree.
          tarball="${RUNNER_TEMP}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${DENY_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" --strip-components=1 -C "${RUNNER_TEMP}" \
            "cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          "${RUNNER_TEMP}/cargo-deny" --version
          "${RUNNER_TEMP}/cargo-deny" check advisories bans licenses sources

      # Cache the cargo registry / git index / build outputs. Keyed on
      # the lockfile + pin files so a vendor bump or dependency change
      # invalidates the cache cleanly. Saves ~3 min on repeat runs.
      - name: Cache cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'vendor/*_VERSION') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # Digest of the pin files' VALUES only — every non-comment, non-blank
      # line, sorted. hashFiles() would hash the whole file, so editing a
      # comment in a pin file invalidated the blob cache and forced a full
      # cold rebuild (~10 min for tor alone). A rebrand that rewrote one
      # comment line per pin file did exactly that. Version and SHA lines are
      # not comments, so a real bump still invalidates the cache exactly once.
      - name: Compute vendor pin digest
        id: pins
        run: |
          digest="$(cat vendor/*_VERSION | grep -vE '^[[:space:]]*#|^[[:space:]]*$' \
                    | sort | sha256sum | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "vendor pin digest: $digest"

      # Cache the materialised vendor blobs across runs whenever the pinned
      # versions are unchanged. tor-from-source alone is ~10 min; without this
      # every release run pays that cost.
      - name: Cache vendor binary blobs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor/*.gz
          key: vendor-${{ runner.os }}-${{ steps.pins.outputs.digest }}

      # Materialise the vendored binary blobs first (xray/telemt/mdnsvpn/
      # dnscrypt/tor/PTs). The quality gate and tests below must run with the
      # blobs present: build.rs flips the `*_bundled` cfgs and bakes the
      # per-binary version/SHA constants from them, and several unit tests
      # assert that pin/blob coherence. Without the blobs those subsystems
      # compile out and the consistency tests fail — so this is not a
      # blob-free job.
      - name: Materialise vendor/*.gz
        run: bash scripts/build.sh --vendor-only

      # Quality gate. A clippy warning or a failing test aborts the job here,
      # before the musl release build and before the tag/release steps — so a
      # regression can never ship. Runs against the host target (debug); the
      # shippable artifact is the separate musl build below.
      #
      # No `cargo fmt --check` gate: this codebase intentionally hand-aligns
      # several declarations (struct-literal tables, multi-arg signatures) in a
      # way stable rustfmt would undo, so a formatting gate would fight the
      # house style.
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Cargo build (musl-static release)
        run: bash scripts/build.sh --cargo-only

      # Inputs for the rest of the steps. `tag` is the canonical
      # version string for this release; `short_hash` is the rev for
      # the release body link.
      - name: Compute version + hash
        id: version
        run: |
          short_hash="$(git rev-parse --short HEAD)"
          # Some repos prefer the calver-ish v3.4.11-rs1 style; adjust
          # the date format if you want only year/month.
          tag="v$(date -u +%Y%m%d)-${short_hash}"
          echo "short_hash=${short_hash}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          binary="target/x86_64-unknown-linux-musl/release/coffeeblack-vpn"
          echo "binary_sha=$(sha256sum "$binary" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Bundle the static binary with its license attribution and the
      # top-level README into a tar.gz. Operators who deploy by hand
      # get a self-contained drop.
      - name: Package release archive
        id: package
        run: |
          mkdir -p dist/coffeeblack-vpn
          cp target/x86_64-unknown-linux-musl/release/coffeeblack-vpn dist/coffeeblack-vpn/coffeeblack-vpn
          cp -r vendor/LICENSES dist/coffeeblack-vpn/LICENSES
          cp README.md dist/coffeeblack-vpn/README.md
          cp vendor/README.md dist/coffeeblack-vpn/VENDOR-README.md
          # Tarball, then plain binary (for users who want to curl it
          # into a Dockerfile without untar).
          tar -C dist -czf "coffeeblack-vpn-${{ steps.version.outputs.tag }}-x86_64-linux-musl.tar.gz" coffeeblack-vpn
          cp target/x86_64-unknown-linux-musl/release/coffeeblack-vpn coffeeblack-vpn
          echo "tarball_sha=$(sha256sum coffeeblack-vpn-${{ steps.version.outputs.tag }}-x86_64-linux-musl.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          # Publish the digests as a real artifact, not just as prose in the
          # release body. `scripts/install.sh` fetches this and verifies the
          # binary before running it as root; a digest a machine cannot read
          # is a digest that never gets checked.
          sha256sum \
            "coffeeblack-vpn-${{ steps.version.outputs.tag }}-x86_64-linux-musl.tar.gz" \
            coffeeblack-vpn > SHA256SUMS

      - name: Compute bundled-component versions
        id: components
        run: |
          # Pull the pinned versions out of the *_VERSION files so the
          # release body documents exactly what shipped.
          read_pin() {
              awk -v k="$2" '
                  BEGIN { pat = "^[[:space:]]*" k "[[:space:]]*=[[:space:]]*" }
                  $0 ~ pat {
                      sub(pat, "", $0)
                      sub(/[[:space:]]*#.*$/, "", $0)
                      sub(/^[[:space:]]+/, "", $0); sub(/[[:space:]]+$/, "", $0)
                      print; exit
                  }
              ' "$1"
          }
          {
            echo "xray=$(read_pin vendor/XRAY_VERSION XRAY_VERSION)"
            echo "telemt=$(read_pin vendor/TELEMT_VERSION TELEMT_VERSION)"
            echo "dnscrypt_proxy=$(read_pin vendor/DNS_BUNDLE_VERSION DNSCRYPT_PROXY_VERSION)"
            echo "tor=$(read_pin vendor/DNS_BUNDLE_VERSION TOR_VERSION)"
            echo "lyrebird=$(read_pin vendor/DNS_BUNDLE_VERSION LYREBIRD_VERSION)"
            echo "snowflake=$(read_pin vendor/DNS_BUNDLE_VERSION SNOWFLAKE_VERSION)"
            echo "webtunnel=$(read_pin vendor/DNS_BUNDLE_VERSION WEBTUNNEL_VERSION)"
          } >> "$GITHUB_OUTPUT"

      # `git push origin <tag>` requires permission to push refs. The
      # default GITHUB_TOKEN with `contents: write` is enough.
      - name: Tag the commit
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: "coffeeblack-vpn ${{ steps.version.outputs.tag }}"
          artifacts: |
            coffeeblack-vpn-${{ steps.version.outputs.tag }}-x86_64-linux-musl.tar.gz
            coffeeblack-vpn
            SHA256SUMS
          body: |
            Statically linked **x86_64-linux** ELF — runs unchanged on
            glibc, musl, or any other libc host. No system packages
            required at runtime beyond `nft` (for the per-client
            firewall) and `awg`/`awg-quick` (the AmneziaWG userspace).

            ## Bundled components

            All embedded via `include_bytes!` at compile time and
            extracted on first run. Versions are pinned in
            `vendor/*_VERSION` and SHA-verified at both build and
            extract time.

            | Component | Version | Purpose |
            |-----------|---------|---------|
            | Xray-core | `${{ steps.components.outputs.xray }}` | Browsing-mode VLESS+Reality+Vision |
            | telemt | `${{ steps.components.outputs.telemt }}` | Telegram MTProxy (Fake-TLS) |
            | dnscrypt-proxy | `${{ steps.components.outputs.dnscrypt_proxy }}` | DoH/DNSCrypt egress |
            | tor | `${{ steps.components.outputs.tor }}` | optional SOCKS over Tor |
            | lyrebird (obfs4) | `${{ steps.components.outputs.lyrebird }}` | pluggable transport |
            | snowflake | `${{ steps.components.outputs.snowflake }}` | pluggable transport |
            | webtunnel | `${{ steps.components.outputs.webtunnel }}` | pluggable transport |

            See [`vendor/README.md`](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/vendor/README.md) for full provenance + license attribution.

            ## SHA-256

            | File | Hash |
            |------|------|
            | `coffeeblack-vpn` | `${{ steps.version.outputs.binary_sha }}` |
            | `coffeeblack-vpn-${{ steps.version.outputs.tag }}-x86_64-linux-musl.tar.gz` | `${{ steps.package.outputs.tarball_sha }}` |

            ## Build info

            - Commit: [`${{ steps.version.outputs.short_hash }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - Build log: [Actions run #${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            See the [README](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/README.md) for installation.
          draft: false
          prerelease: false
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
